<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Your FishIn code</title>
<link rel="icon" href="icon-192.png">
<style>
  :root { --bg:#0a0a0b; --card:#161618; --box:#222225; --text:#f6f6f5; --muted:#9a9ba0; --inv:#f6f6f5; --on-inv:#0a0a0b; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text);
         font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  main { width:100%; max-width:420px; text-align:center; }
  img { width:64px; height:64px; border-radius:16px; }
  h1 { font-size:24px; font-weight:600; margin:20px 0 6px; }
  p { color:var(--muted); margin:0; }
  .code { display:flex; gap:6px; justify-content:center; margin:28px 0 24px; }
  .code span { width:40px; height:52px; border-radius:12px; background:var(--box); display:flex; align-items:center;
               justify-content:center; font:600 26px/1 "SF Mono",Menlo,Consolas,monospace; }
  button { width:100%; height:54px; border:0; border-radius:27px; background:var(--inv); color:var(--on-inv);
           font:600 16px/1 inherit; font-family:inherit; cursor:pointer; }
  button.done { background:var(--box); color:var(--text); }
  .hint { margin-top:16px; font-size:14px; }
  @media (max-width:380px) { .code span { width:34px; height:46px; font-size:22px; } .code { gap:4px; } }
</style>
</head>
<body>
<main>
  <img src="icon-192.png" alt="FishIn">
  <h1 id="title">Your FishIn code</h1>
  <p id="sub">Copy it, then go back to FishIn and paste it.</p>
  <div class="code" id="code" aria-label="Sign-in code"></div>
  <button id="copy" type="button">Copy code</button>
  <p class="hint" id="hint">The code works once and expires in one hour.</p>
</main>
<script>
  // The code comes in the link's #fragment, which browsers never send to a server.
  const code = (location.hash.slice(1).match(/^\d{4,10}$/) || [""])[0];
  const box = document.getElementById("code"), btn = document.getElementById("copy");
  if (!code) {
    document.getElementById("title").textContent = "No code in this link";
    document.getElementById("sub").textContent = "Open the link from your latest FishIn email, or type the code from the email into the app.";
    btn.hidden = true; document.getElementById("hint").hidden = true;
  } else {
    for (const d of code) { const s = document.createElement("span"); s.textContent = d; box.appendChild(s); }
    btn.addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(code); }
      catch { const t = document.createElement("textarea"); t.value = code; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
      btn.textContent = "Copied ✓  Now paste it in FishIn"; btn.classList.add("done");
    });
  }
</script>
</body>
</html>
